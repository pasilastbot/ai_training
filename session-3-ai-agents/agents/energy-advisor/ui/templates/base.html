<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Energy Advisor{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        .gradient-bg { background: linear-gradient(135deg, #10b981 0%, #059669 100%); }
        .card-hover:hover { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body class="bg-gray-50 min-h-screen">
    <nav class="gradient-bg text-white shadow-lg">
        <div class="container mx-auto px-4 py-4">
            <div class="flex items-center justify-between">
                <a href="/" class="flex items-center space-x-3">
                    <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/>
                    </svg>
                    <span class="text-xl font-bold">Energy Advisor</span>
                </a>
                <div class="flex space-x-6">
                    <a href="/" class="hover:text-green-200 transition">Dashboard</a>
                    <a href="/apartments" class="hover:text-green-200 transition">Apartments</a>
                    <a href="/chat" class="hover:text-green-200 transition">Chat</a>
                    <a href="/knowledge" class="hover:text-green-200 transition">Knowledge</a>
                    <a href="/videos" class="hover:text-green-200 transition">Videos</a>
                </div>
            </div>
        </div>
    </nav>

    <main class="container mx-auto px-4 py-8">
        {% block content %}{% endblock %}
    </main>

    <footer class="bg-gray-800 text-gray-400 py-6 mt-12">
        <div class="container mx-auto px-4 text-center">
            <p>Powered by Leanheat Building Technology</p>
            <p class="text-sm mt-2">AI-powered heating optimization for energy savings</p>
        </div>
    </footer>

    {% block extra_js %}{% endblock %}
</body>
</html>
