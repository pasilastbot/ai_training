{% extends "base.html" %}

{% block title %}Error - Energy Advisor{% endblock %}

{% block content %}
<div class="max-w-lg mx-auto text-center py-12">
    <svg class="w-24 h-24 mx-auto text-gray-300 mb-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
    </svg>
    <h1 class="text-3xl font-bold text-gray-800 mb-4">{{ message or 'Something went wrong' }}</h1>
    <p class="text-gray-600 mb-8">We couldn't complete your request. Please try again or go back to the dashboard.</p>
    <div class="flex justify-center space-x-4">
        <a href="/" class="bg-green-500 text-white px-6 py-3 rounded-lg hover:bg-green-600 transition">
            Go to Dashboard
        </a>
        <button onclick="history.back()" class="bg-gray-200 text-gray-800 px-6 py-3 rounded-lg hover:bg-gray-300 transition">
            Go Back
        </button>
    </div>
</div>
{% endblock %}
